<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Surface Pro Cleaning</title>
<style>
  :root{
    --blue-900:#003078;--blue-700:#0060c0;--sky:#60c0d8;
    --yellow:#f0a800;--yellow-bright:#ffc02e;--ink:#0e1116;--muted:#5b6470;
    --paper:#fff;--soft:#f3f7fb;--line:#e3eaf2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:1.2rem;
    background:linear-gradient(120deg,var(--blue-900),var(--blue-700));
  }
  .card{
    width:min(400px,100%);background:var(--paper);border-radius:20px;
    box-shadow:0 20px 50px rgba(0,16,40,.35);padding:2.2rem 2rem;
  }
  .brand{text-align:center;margin-bottom:1.6rem}
  .brand b{display:block;font-size:1.25rem}
  .brand span{display:block;font-size:.72rem;color:var(--blue-700);font-weight:700;
    letter-spacing:1px;text-transform:uppercase;margin-top:.2rem}
  label{display:block;font-weight:600;font-size:.9rem;margin:.9rem 0 .35rem}
  input{
    width:100%;padding:.8rem .9rem;border:1px solid var(--line);border-radius:12px;
    font-size:1rem;background:var(--soft);
  }
  input:focus{outline:2px solid var(--yellow);border-color:transparent}
  button{
    width:100%;margin-top:1.4rem;padding:.9rem;border:0;border-radius:999px;
    background:var(--yellow);color:var(--ink);font-weight:800;font-size:1rem;cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease;
  }
  button:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,193,7,.5)}
  .msg{margin-top:1rem;font-size:.9rem;min-height:1.2em;color:#c0392b;text-align:center}
  .back{display:block;text-align:center;margin-top:1.2rem;color:var(--blue-700);
    font-size:.9rem;text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <b>Surface Pro Cleaning</b>
      <span>Admin sign in</span>
    </div>
    <label for="username">Username</label>
    <input id="username" autocomplete="username" autofocus />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="submit">Sign in</button>
    <div class="msg" id="msg"></div>
    <a class="back" href="/">← Back to site</a>
  </div>
<script>
  const $ = id => document.getElementById(id);
  const msg = $('msg');
  async function login(){
    msg.style.color = '#c0392b'; msg.textContent = '';
    const username = $('username').value.trim();
    const password = $('password').value;
    try{
      const r = await fetch('/api/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username, password })
      });
      const data = await r.json().catch(()=>({}));
      if(r.ok){ window.location.href = '/admin'; return; }
      msg.textContent = data.error || 'Sign in failed.';
    }catch(e){ msg.textContent = 'Network error. Try again.'; }
  }
  $('submit').addEventListener('click', login);
  $('password').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
  $('username').addEventListener('keydown', e => { if(e.key==='Enter') $('password').focus(); });
</script>
</body>
</html>
